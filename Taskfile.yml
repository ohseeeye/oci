# https://taskfile.dev

version: "3"

vars:
  GOLANGCI_LINT_VERSION: v2.10.1
  GO_VERSION: "1.25.0"
  LINT_IMAGE: "golangci/golangci-lint:{{.GOLANGCI_LINT_VERSION}}"

tasks:
  test:
    desc: Run all tests
    dir: .
    cmds:
      - go test ./...
      - task: test:ocisqlite
      - task: test:ocis3

  test:ocis3:
    desc: Run the S3 module tests
    dir: '{{.ROOT_DIR}}/ocis3'
    cmd: go test ./...

  test:ocisqlite:
    desc: Run the SQLite module tests
    dir: '{{.ROOT_DIR}}/ocisqlite'
    cmd: go test ./...

  lint:
    desc: Run golangci-lint inside a Docker container
    dir: .
    cmds:
      - for: [".", "ocisqlite", "ocis3"]
        cmd: >-
          docker run --rm
          -v {{.ROOT_DIR}}:/workspace
          -w /workspace/{{.ITEM}}
          -e GOFLAGS=-buildvcs=false
          -e GOLANGCI_LINT_CACHE=/tmp/.golangci-lint-cache
          {{.LINT_IMAGE}}
          golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with auto-fix inside a Docker container
    dir: .
    cmds:
      - for: [".", "ocisqlite", "ocis3"]
        cmd: >-
          docker run --rm
          -v {{.ROOT_DIR}}:/workspace
          -w /workspace/{{.ITEM}}
          -e GOFLAGS=-buildvcs=false
          -e GOLANGCI_LINT_CACHE=/tmp/.golangci-lint-cache
          {{.LINT_IMAGE}}
          golangci-lint run --fix ./...

  check:
    desc: Run all checks (lint + test)
    cmds:
      - task: lint
      - task: test

  conformance:
    desc: Run OCI distribution conformance tests against all supported backends
    dir: '{{.ROOT_DIR}}'
    env:
      OCI_CONFORMANCE_RESULTS: '{{.ROOT_DIR}}/results'
    cmds:
      - go test -tags=integration ./ocimem ./ocilayout -run TestOCIConformance -count=1 -v
      - task: conformance:ocisqlite
      - task: conformance:ocis3

  conformance:ocis3:
    desc: Run S3 integration and OCI distribution conformance tests against MinIO
    dir: '{{.ROOT_DIR}}/ocis3'
    env:
      OCI_CONFORMANCE_RESULTS: '{{.ROOT_DIR}}/results'
    cmd: go test -tags=integration ./... -run 'TestS3Integration|TestOCIConformance' -count=1 -v

  conformance:ocimem:
    desc: Run OCI distribution conformance tests against ocimem
    dir: '{{.ROOT_DIR}}'
    env:
      OCI_CONFORMANCE_RESULTS: '{{.ROOT_DIR}}/results'
    cmd: go test -tags=integration ./ocimem -run TestOCIConformance -count=1 -v

  conformance:ocilayout:
    desc: Run OCI distribution conformance tests against ocilayout
    dir: '{{.ROOT_DIR}}'
    env:
      OCI_CONFORMANCE_RESULTS: '{{.ROOT_DIR}}/results'
    cmd: go test -tags=integration ./ocilayout -run TestOCIConformance -count=1 -v

  conformance:ocisqlite:
    desc: Run OCI distribution conformance tests against ocisqlite
    dir: '{{.ROOT_DIR}}/ocisqlite'
    env:
      OCI_CONFORMANCE_RESULTS: '{{.ROOT_DIR}}/results'
    cmd: go test -tags=integration ./... -run TestOCIConformance -count=1 -v

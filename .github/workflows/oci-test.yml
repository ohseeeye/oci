name: "oci: test"

on:
  pull_request:
    paths:
      - "**"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "ocisqlite", "ocis3"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

  conformance:
    name: OCI conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"

      - name: Run OCI distribution conformance tests
        env:
          OCI_CONFORMANCE_RESULTS: ${{ github.workspace }}/results
        run: go test -tags=integration ./ocimem ./ocilayout -run TestOCIConformance -count=1 -v

      - name: Run SQLite OCI distribution conformance tests
        working-directory: ocisqlite
        env:
          OCI_CONFORMANCE_RESULTS: ${{ github.workspace }}/results
        run: go test -tags=integration ./... -run TestOCIConformance -count=1 -v

      - name: Run S3 integration and OCI distribution conformance tests
        working-directory: ocis3
        env:
          OCI_CONFORMANCE_RESULTS: ${{ github.workspace }}/results
        run: go test -tags=integration ./... -run 'TestS3Integration|TestOCIConformance' -count=1 -v
